version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: math-top-mysql
    environment:
      MYSQL_ROOT_PASSWORD: nzdmath123_db_password
      MYSQL_DATABASE: math_top
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pnzdmath123_db_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - math-top-network

  redis:
    image: redis:7-alpine
    container_name: math-top-redis
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - math-top-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: math-top-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - APP_ENV=docker
    volumes:
      - ./backend/storage/uploads:/app/storage/uploads
    expose:
      - "8080"
    networks:
      - math-top-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: math-top-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - math-top-network

volumes:
  mysql_data:
  redis_data:

networks:
  math-top-network:
    driver: bridge
